# SPDX-License-Identifier: MIT
# Kray-SoM-RKC SSH settings. sshd uses the first value it reads for each
# option, and this file is read before the rest of /etc/ssh/sshd_config.
# Root may still log in with a password: the image's first login over SSH
# depends on it, and the initial password is expired.
PermitRootLogin yes
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
