#!/usr/sbin/nft -f
# SPDX-License-Identifier: MIT
# Kray-SoM-RKC firewall: inbound connections are dropped except for the
# services the image needs. Outbound traffic is not filtered.
#
# To open a port, add a file to /etc/nftables.d/, e.g.
# /etc/nftables.d/http.nft:
#     add rule inet kray input tcp dport 80 accept
# then: systemctl reload nftables
# To switch the firewall off: systemctl disable --now nftables
#
# Only the kray table is replaced, so rules added by other tools (Docker,
# for example) are kept.

table inet kray
delete table inet kray

table inet kray {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif lo accept

		# ping and the ICMPv6 messages that IPv6 needs (neighbour discovery, router advertisements)
		meta l4proto icmp limit rate 20/second accept
		meta l4proto ipv6-icmp accept

		# DHCP and DHCPv6 replies
		udp dport 68 accept
		ip6 saddr fe80::/10 udp dport 546 accept

		# SSH
		tcp dport 22 accept
		# mDNS (avahi): <hostname>.local
		udp dport 5353 accept
	}
}

include "/etc/nftables.d/*.nft"
