# kray-demo settings. Restart the demo after a change:
#   sudo systemctl restart kray-demo
# On the demo image the root file system is read-only; see
# /usr/share/doc/kray-demo/README for how to change this file.

# Text in the panel
title = Kray-SoM-RKC
subtitle = Rockchip RK3566 · Edge AI demo
footer1 = YOLOv8n INT8 on the RK3566 NPU
footer2 = Kray OS · Debian 13 · Linux 6.1

# Camera picture: mirror = 1 shows it like a mirror (camera facing the
# visitors); rotate180 = 1 for a camera mounted upside down.
mirror = 1
rotate180 = 0

# Minimum detection confidence (0..1). Higher: fewer false detections.
threshold = 0.40

# Auto exposure: target mean brightness (0..255) and the highest gain
# (IMX219 driver units: 2728 = 10.66x analogue, 10912 = plus 4x digital).
target_luma = 110
max_gain = 10912

# White balance: awb = 1 adjusts the ISP red/blue gains automatically
# (256 = 1.0; wb_red / wb_blue are the start values). awb = 0 keeps
# wb_red / wb_blue fixed.
awb = 1
wb_red = 400
wb_blue = 400

# H.265 live stream of the screen, encoded by the hardware video encoder and
# served as a web page by kray-demo-stream on stream_port
# (http://<board address>:8080). stream = 0 switches the encoder off.
stream = 1
stream_kbps = 4000
stream_fps = 30
stream_port = 8080
