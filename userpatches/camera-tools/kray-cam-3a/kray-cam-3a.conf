# Kray-SoM-RKC: kray-cam-3a, simple auto exposure and white balance for the
# camera (vendor image). Restart after a change:
#   sudo systemctl restart kray-cam-3a
# The demo image has its own 3A; this service is not used there.

# Auto exposure: exposure first, then gain, to bring the mean level (raw,
# linear, 0..1 above black) to the target.
ae = 1
target = 0.30
# Limits: exposure in lines (0 = the sensor's maximum for the mode),
# total gain as a factor.
max_exposure = 0
max_gain = 16
# Frames between exposure changes (the sensor applies them a few frames late).
ae_interval = 3

# Auto white balance (grey world on near-neutral areas). With awb = 0 the
# fixed gains below are used (1.0 = no change).
awb = 1
wb_red = 1.6
wb_blue = 1.6

# ISP output: gamma (0 = linear output, darker) and black level subtraction.
gamma = 2.2
black_level_subtraction = 1
# Sensor black level as a fraction of full scale (64 of 1023 for the
# IMX219, IMX477 and most Raspberry Pi camera sensors).
black_level = 0.0625

# Lens shading correction (brightens the darker corners) with the table
# lsc-<sensor>-<width>x<height>.conf from lsc_dir; one is shipped for the
# IMX219, kray-cam-lsc makes one for another camera. A table for the
# sensor's full-size mode also serves its binned and cropped modes.
lsc = 1
lsc_dir = /etc/kray-cam-3a

# Sensor sub-device name to control (empty = the camera module).
sensor =
